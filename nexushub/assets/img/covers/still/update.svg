<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
<style>*{animation:none!important}
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
  .spin-r{transform-box:fill-box;transform-origin:center;animation:spin 22s linear infinite reverse}
  .spin-slow{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
  .float{animation:float 3.4s ease-in-out infinite}
  .tw{animation:tw 2.2s ease-in-out infinite}.d2{animation-delay:1.1s}.d3{animation-delay:.6s}.d4{animation-delay:1.6s}
  .blink{animation:blink 1.1s steps(2,start) infinite}
  .sweep{animation:sweep 5s ease-in-out infinite}
  .scan{animation:scan 4s linear infinite}
  .glitch1{animation:g1 2.6s steps(1) infinite}.glitch2{animation:g2 2.6s steps(1) infinite}
  .rise{animation:rise 6s linear infinite}
  .flow{stroke-dasharray:14 22;animation:flow 1.6s linear infinite}
  .bar{transform-box:fill-box;transform-origin:left center;animation:bar 2.8s ease-in-out infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{50%{transform:scale(1.12);opacity:.55}}
  @keyframes float{50%{transform:translateY(-14px)}}
  @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes blink{to{visibility:hidden}}
  @keyframes sweep{0%{transform:translateX(-900px)}55%,100%{transform:translateX(1500px)}}
  @keyframes scan{from{transform:translateY(-120px)}to{transform:translateY(900px)}}
  @keyframes g1{0%,86%,100%{transform:none;opacity:0}88%{transform:translate(-8px,2px);opacity:.85}92%{transform:translate(6px,-3px);opacity:.85}}
  @keyframes g2{0%,86%,100%{transform:none;opacity:0}89%{transform:translate(7px,1px);opacity:.8}93%{transform:translate(-5px,-2px);opacity:.8}}
  @keyframes rise{from{transform:translateY(0);opacity:0}15%{opacity:.9}to{transform:translateY(-420px);opacity:0}}
  @keyframes flow{to{stroke-dashoffset:-72}}
  @keyframes bar{0%{transform:scaleX(.05)}60%,100%{transform:scaleX(1)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs>
  <radialGradient id="bg" cx="50%" cy="42%" r="75%"><stop offset="0" stop-color="#1de9b6" stop-opacity=".55"/><stop offset=".45" stop-color="#02201b"/><stop offset="1" stop-color="#050507"/></radialGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#2979ff" stop-opacity=".75"/><stop offset="1" stop-color="#2979ff" stop-opacity="0"/></radialGradient>
  <linearGradient id="ig" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1de9b6"/><stop offset="1" stop-color="#2979ff"/></linearGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1de9b6" stop-opacity=".95"/><stop offset="1" stop-color="#2979ff" stop-opacity=".15"/></linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="scanl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2979ff" stop-opacity="0"/><stop offset=".85" stop-color="#2979ff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity=".35"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".05" stroke-width="1"/></pattern>
  </defs>
<rect width="1200" height="750" fill="url(#bg)"/>

<rect width="1200" height="750" fill="url(#grid)" opacity=".7"/>
<g stroke="#1de9b6" stroke-opacity=".35" stroke-width="2"><path d="M600 430 L-1800 750"/><path d="M600 430 L-1500 750"/><path d="M600 430 L-1200 750"/><path d="M600 430 L-900 750"/><path d="M600 430 L-600 750"/><path d="M600 430 L-300 750"/><path d="M600 430 L0 750"/><path d="M600 430 L300 750"/><path d="M600 430 L600 750"/><path d="M600 430 L900 750"/><path d="M600 430 L1200 750"/><path d="M600 430 L1500 750"/><path d="M600 430 L1800 750"/><path d="M0 470 H1200"/><path d="M0 520 H1200"/><path d="M0 590 H1200"/><path d="M0 680 H1200"/></g>
<rect x="0" y="430" width="1200" height="320" fill="url(#scanl)" opacity=".35"/>
<circle class="pulse" cx="600" cy="290" r="250" fill="url(#glow)" opacity=".6"/>
<circle class="spin" cx="600" cy="290" r="190" fill="none" stroke="url(#ring)" stroke-width="3" stroke-dasharray="8 14"/>
<circle class="spin-r" cx="600" cy="290" r="152" fill="none" stroke="url(#ring)" stroke-width="2" stroke-dasharray="160 50" opacity=".7"/>
<circle cx="600" cy="290" r="120" fill="#0b0b12" fill-opacity=".6" stroke="#fff" stroke-opacity=".14" stroke-width="2"/>
<g class="float"><g transform="translate(600 290) scale(8.6) translate(-12 -12)"><g class="spin-slow"><path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6zm9 5.3v-3l-2.4-.5a7 7 0 0 0-.8-1.9l1.4-2-2.1-2.1-2 1.4a7 7 0 0 0-1.9-.8L12.7 2h-3l-.5 2.4a7 7 0 0 0-1.9.8l-2-1.4-2.1 2.1 1.4 2a7 7 0 0 0-.8 1.9L1.4 10.5v3l2.4.5c.2.7.4 1.3.8 1.9l-1.4 2 2.1 2.1 2-1.4c.6.4 1.2.6 1.9.8l.5 2.4h3l.5-2.4c.7-.2 1.3-.4 1.9-.8l2 1.4 2.1-2.1-1.4-2c.4-.6.6-1.2.8-1.9z" fill="url(#ig)" stroke="#fff" stroke-opacity=".45" stroke-width=".4"/></g></g></g>

<text x="600" y="650" text-anchor="middle" font-size="96" fill="#fff" font-family="Arial Black, Impact, Arial, Helvetica, sans-serif" font-weight="900" letter-spacing="6" style="paint-order:stroke" stroke="#1de9b6" stroke-opacity=".35" stroke-width="10">UPDATE</text>

<text x="600" y="706" text-anchor="middle" font-size="26" fill="#2979ff" letter-spacing="12" font-family="Arial, Helvetica, sans-serif" font-weight="700">PATCH NOTES · V2.0</text>
<g opacity=".9"><rect x="420" y="560" width="360" height="12" rx="6" fill="#fff" fill-opacity=".1"/><rect class="bar" x="420" y="560" width="360" height="12" rx="6" fill="url(#ig)"/></g>
<rect x="40" y="40" width="190" height="46" rx="23" fill="#000" fill-opacity=".45" stroke="#1de9b6" stroke-opacity=".7" stroke-width="2"/>
<circle class="blink" cx="68" cy="63" r="8" fill="#1de9b6"/><text x="88" y="72" font-size="24" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-weight="800" letter-spacing="3">NEXUS</text>
<circle class="rise" cx="120" cy="760" r="4" fill="#2979ff" style="animation-delay:-0s"/><circle class="rise" cx="260" cy="760" r="3" fill="#2979ff" style="animation-delay:-2.1s"/><circle class="rise" cx="420" cy="760" r="5" fill="#2979ff" style="animation-delay:-4s"/><circle class="rise" cx="780" cy="760" r="3" fill="#2979ff" style="animation-delay:-1.2s"/><circle class="rise" cx="930" cy="760" r="4" fill="#2979ff" style="animation-delay:-3.3s"/><circle class="rise" cx="1080" cy="760" r="3" fill="#2979ff" style="animation-delay:-5.1s"/><circle class="rise" cx="520" cy="760" r="2.5" fill="#2979ff" style="animation-delay:-2.7s"/><circle class="rise" cx="680" cy="760" r="3.5" fill="#2979ff" style="animation-delay:-0.6s"/>
<circle class="tw " cx="180" cy="150" r="3" fill="#fff"/><circle class="tw d2" cx="1010" cy="120" r="2.6" fill="#fff"/><circle class="tw d3" cx="1080" cy="300" r="2" fill="#fff"/><circle class="tw d4" cx="110" cy="330" r="2.2" fill="#fff"/><circle class="tw " cx="880" cy="80" r="2" fill="#fff"/><circle class="tw d2" cx="320" cy="90" r="1.8" fill="#fff"/>
<g transform="skewX(-20)"><rect class="sweep" x="0" y="-200" width="320" height="1200" fill="url(#shine)"/></g>
<rect class="scan" x="0" y="0" width="1200" height="120" fill="url(#scanl)" opacity=".25"/>
</svg>