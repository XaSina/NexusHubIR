<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
<style>
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
  .spin-r{transform-box:fill-box;transform-origin:center;animation:spin 22s linear infinite reverse}
  .spin-slow{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
  .float{animation:float 3.4s ease-in-out infinite}
  .tw{animation:tw 2.2s ease-in-out infinite}.d2{animation-delay:1.1s}.d3{animation-delay:.6s}.d4{animation-delay:1.6s}
  .blink{animation:blink 1.1s steps(2,start) infinite}
  .sweep{animation:sweep 5s ease-in-out infinite}
  .scan{animation:scan 4s linear infinite}
  .glitch1{animation:g1 2.6s steps(1) infinite}.glitch2{animation:g2 2.6s steps(1) infinite}
  .rise{animation:rise 6s linear infinite}
  .flow{stroke-dasharray:14 22;animation:flow 1.6s linear infinite}
  .bar{transform-box:fill-box;transform-origin:left center;animation:bar 2.8s ease-in-out infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{50%{transform:scale(1.12);opacity:.55}}
  @keyframes float{50%{transform:translateY(-14px)}}
  @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes blink{to{visibility:hidden}}
  @keyframes sweep{0%{transform:translateX(-900px)}55%,100%{transform:translateX(1500px)}}
  @keyframes scan{from{transform:translateY(-120px)}to{transform:translateY(900px)}}
  @keyframes g1{0%,86%,100%{transform:none;opacity:0}88%{transform:translate(-8px,2px);opacity:.85}92%{transform:translate(6px,-3px);opacity:.85}}
  @keyframes g2{0%,86%,100%{transform:none;opacity:0}89%{transform:translate(7px,1px);opacity:.8}93%{transform:translate(-5px,-2px);opacity:.8}}
  @keyframes rise{from{transform:translateY(0);opacity:0}15%{opacity:.9}to{transform:translateY(-420px);opacity:0}}
  @keyframes flow{to{stroke-dashoffset:-72}}
  @keyframes bar{0%{transform:scaleX(.05)}60%,100%{transform:scaleX(1)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs>
  <radialGradient id="bg" cx="50%" cy="42%" r="75%"><stop offset="0" stop-color="#3dbbff" stop-opacity=".55"/><stop offset=".45" stop-color="#06142a"/><stop offset="1" stop-color="#050507"/></radialGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8a5cff" stop-opacity=".75"/><stop offset="1" stop-color="#8a5cff" stop-opacity="0"/></radialGradient>
  <linearGradient id="ig" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3dbbff"/><stop offset="1" stop-color="#8a5cff"/></linearGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3dbbff" stop-opacity=".95"/><stop offset="1" stop-color="#8a5cff" stop-opacity=".15"/></linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="scanl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a5cff" stop-opacity="0"/><stop offset=".85" stop-color="#8a5cff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity=".35"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".05" stroke-width="1"/></pattern>
  </defs>
<rect width="800" height="600" fill="url(#bg)"/><rect width="800" height="600" fill="url(#grid)"/>
<g stroke="#fff" stroke-opacity=".06" stroke-width="2"><path d="M-200 600 L100 0"/><path d="M-130 600 L170 0"/><path d="M-60 600 L240 0"/><path d="M10 600 L310 0"/><path d="M80 600 L380 0"/><path d="M150 600 L450 0"/><path d="M220 600 L520 0"/><path d="M290 600 L590 0"/><path d="M360 600 L660 0"/><path d="M430 600 L730 0"/><path d="M500 600 L800 0"/><path d="M570 600 L870 0"/><path d="M640 600 L940 0"/><path d="M710 600 L1010 0"/><path d="M780 600 L1080 0"/><path d="M850 600 L1150 0"/></g>
<circle class="pulse" cx="400" cy="300" r="270" fill="url(#glow)" opacity=".55"/>
<circle class="spin" cx="400" cy="300" r="225" fill="none" stroke="url(#ring)" stroke-width="2.5" stroke-dasharray="6 12"/>
<circle class="spin-r" cx="400" cy="300" r="185" fill="none" stroke="url(#ring)" stroke-width="1.5" stroke-dasharray="120 40" opacity=".7"/>
<circle cx="400" cy="300" r="150" fill="#0b0b12" fill-opacity=".55" stroke="#fff" stroke-opacity=".12" stroke-width="2"/>
<g class="float"><g transform="translate(400 300) scale(11) translate(-12 -12)"><g class="spin-slow"><path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6zm9 5.3v-3l-2.4-.5a7 7 0 0 0-.8-1.9l1.4-2-2.1-2.1-2 1.4a7 7 0 0 0-1.9-.8L12.7 2h-3l-.5 2.4a7 7 0 0 0-1.9.8l-2-1.4-2.1 2.1 1.4 2a7 7 0 0 0-.8 1.9L1.4 10.5v3l2.4.5c.2.7.4 1.3.8 1.9l-1.4 2 2.1 2.1 2-1.4c.6.4 1.2.6 1.9.8l.5 2.4h3l.5-2.4c.7-.2 1.3-.4 1.9-.8l2 1.4 2.1-2.1-1.4-2c.4-.6.6-1.2.8-1.9z" fill="url(#ig)" stroke="#fff" stroke-opacity=".45" stroke-width=".4"/></g></g></g>
<circle class="tw " cx="120" cy="110" r="3" fill="#fff"/><circle class="tw d2" cx="690" cy="140" r="2.4" fill="#fff"/><circle class="tw d3" cx="640" cy="470" r="3" fill="#fff"/><circle class="tw d4" cx="150" cy="470" r="2" fill="#fff"/><circle class="tw " cx="560" cy="90" r="1.8" fill="#fff"/><circle class="tw d2" cx="250" cy="200" r="1.6" fill="#fff"/><circle class="tw d3" cx="720" cy="330" r="2.2" fill="#fff"/><circle class="tw d4" cx="90" cy="300" r="1.8" fill="#fff"/>
<g transform="skewX(-20)"><rect class="sweep" x="0" y="-100" width="260" height="800" fill="url(#shine)"/></g>
<path d="M0 560 Q400 520 800 560 V600 H0Z" fill="#3dbbff" opacity=".08"/>
</svg>