<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
<style>
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 12s linear infinite}
  .spin-r{transform-box:fill-box;transform-origin:center;animation:spin 26s linear infinite reverse}
  .float{animation:float 3.6s ease-in-out infinite}
  .tw{animation:tw 2.2s ease-in-out infinite}.d2{animation-delay:.7s}.d3{animation-delay:1.3s}.d4{animation-delay:1.8s}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-in-out infinite}
  .sweep{animation:sweep 4.5s ease-in-out infinite}
  .rise{animation:rise 5s linear infinite}
  .blink{animation:blink 1s steps(2,start) infinite}.blink2{animation:blink 1s steps(2,start) .5s infinite}
  .rock{transform-box:fill-box;transform-origin:50% 100%;animation:rock 4s ease-in-out infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes float{50%{transform:translateY(-16px)}}
  @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
  @keyframes pulse{50%{transform:scale(1.1);opacity:.6}}
  @keyframes sweep{0%{transform:translateX(-700px)}60%,100%{transform:translateX(1300px)}}
  @keyframes rise{from{transform:translateY(620px)}to{transform:translateY(-80px)}}
  @keyframes blink{to{visibility:hidden}}
  @keyframes rock{50%{transform:rotate(-4deg)}}
</style>
<defs>
  <radialGradient id="bg" cx="50%" cy="38%" r="75%"><stop offset="0" stop-color="#3a0d1d"/><stop offset=".55" stop-color="#150812"/><stop offset="1" stop-color="#07050b"/></radialGradient>
  <radialGradient id="glow" r="50%"><stop offset="0" stop-color="#ff3d5e" stop-opacity=".55"/><stop offset="1" stop-color="#ff3d5e" stop-opacity="0"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1a8"/><stop offset=".45" stop-color="#ffc53d"/><stop offset="1" stop-color="#c77a12"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5a76"/><stop offset="1" stop-color="#c2102e"/></linearGradient>
  <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<rect width="800" height="600" fill="url(#bg)"/>
<circle cx="400" cy="290" r="300" fill="url(#glow)" class="pulse"/>
<g fill="#fff"><circle class="tw" cx="90" cy="90" r="3"/><circle class="tw d2" cx="700" cy="120" r="2.5"/><circle class="tw d3" cx="640" cy="470" r="3"/><circle class="tw d4" cx="150" cy="480" r="2.5"/><circle class="tw d2" cx="250" cy="70" r="2"/><circle class="tw d3" cx="560" cy="60" r="2"/></g>
<g class="float"><g transform="translate(360 250) rotate(-10)"><path d="M-150 -70 H150 V-22 A22 22 0 0 0 150 22 V70 H-150 V22 A22 22 0 0 0 -150 -22 Z" fill="url(#red)" stroke="#fff" stroke-opacity=".35" stroke-width="3"/>
<line x1="60" y1="-60" x2="60" y2="60" stroke="#fff" stroke-opacity=".55" stroke-width="4" stroke-dasharray="10 10"/>
<text x="-45" y="18" text-anchor="middle" font-family="Vazirmatn, Tahoma, sans-serif" font-weight="900" font-size="54" fill="#fff">WIN</text>
<text x="105" y="14" text-anchor="middle" font-family="monospace" font-weight="900" font-size="30" fill="#fff" transform="rotate(-90 105 0)">#07</text></g></g><g class="float" style="animation-delay:-1.8s"><g transform="translate(450 340) rotate(8)"><path d="M-150 -70 H150 V-22 A22 22 0 0 0 150 22 V70 H-150 V22 A22 22 0 0 0 -150 -22 Z" fill="#7c4dff" stroke="#fff" stroke-opacity=".35" stroke-width="3"/>
<line x1="60" y1="-60" x2="60" y2="60" stroke="#fff" stroke-opacity=".55" stroke-width="4" stroke-dasharray="10 10"/>
<text x="-45" y="18" text-anchor="middle" font-family="Vazirmatn, Tahoma, sans-serif" font-weight="900" font-size="54" fill="#fff">WIN</text>
<text x="105" y="14" text-anchor="middle" font-family="monospace" font-weight="900" font-size="30" fill="#fff" transform="rotate(-90 105 0)">#42</text></g></g><text x="400" y="560" text-anchor="middle" font-family="Vazirmatn, Tahoma, sans-serif" font-weight="900" font-size="34" fill="#fff" letter-spacing="2">TICKETS</text><rect class="sweep" x="0" y="0" width="160" height="600" fill="url(#shine)" transform="skewX(-18)"/>
</svg>
